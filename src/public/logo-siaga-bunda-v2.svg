<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title desc">
<title>SIAGA Bunda — ibu hamil dalam pelukan</title>
<desc>Logo revisi: dua tangan melindungi siluet ibu hamil, perut sebagai daun kehidupan, bintang pengetahuan di atas. Satu warna Sage #6B8E73, scalable, negative space.</desc>
<!-- Background transparent -->
<!-- Dua tangan pelindung — geometri disederhanakan dari mark lama, tetap ownable -->
<path fill="#6B8E73" d="M 58 32 C 44 42 26 66 22 92 C 18 120 28 148 56 174 C 62 180 66 184 70 188 C 76 186 82 176 86 164 C 90 150 92 138 90 126 C 88 114 84 104 78 96 C 74 92 70 88 66 84 C 62 80 58 76 54 72 C 52 68 54 62 62 64 C 70 66 78 76 84 84 C 90 92 96 102 100 112 C 104 102 110 92 116 84 C 122 76 130 66 138 64 C 146 62 148 68 146 72 C 142 76 138 80 134 84 C 130 88 126 92 122 96 C 116 104 112 114 110 126 C 108 138 110 150 114 164 C 118 176 124 186 130 188 C 134 184 138 180 144 174 C 172 148 182 120 178 92 C 174 66 156 42 142 32 C 134 26 122 28 122 38 C 122 44 128 52 132 60 C 138 72 144 84 146 96 C 148 108 146 120 138 128 C 134 132 130 134 126 136 C 122 128 118 118 112 108 C 106 96 98 84 92 76 C 88 70 84 66 80 64 C 76 66 72 70 68 76 C 62 84 54 96 48 108 C 42 118 38 128 34 136 C 30 134 26 132 22 128 C 14 120 12 108 14 96 C 16 84 22 72 28 60 C 32 52 38 44 38 38 C 38 28 26 26 58 32 Z"/>
<!-- Siluet ibu hamil — negative space dipertajam: satu goresan, perut sebagai kurva daun -->
<g fill="#6B8E73">
  <!-- kepala ibu -->
  <circle cx="100" cy="58" r="9.5" />
  <!-- siluet ibu hamil — satu bidang, perut = kurva daun, kaki menyatu sebagai batang -->
  <path d="M 98.5 69 C 97 73 93.5 77.5 91 83 C 84.5 95 82 105.5 84.5 115.5 C 86 122.5 89.5 129 95 135.5 C 97.5 138.5 100 142 102 146.5 C 104 142 106.5 138.5 109 135.5 C 114.5 129 118 122.5 119.5 115.5 C 122 105.5 119.5 95 113 83 C 110.5 77.5 107 73 105.5 69 C 103.5 71.5 102 74 100 77.5 C 98 74 100 71.5 98.5 69 Z"/>
  <!-- negative cut: lekuk lengan memeluk perut + urat daun sebagai garis napas -->
  <path fill="white" d="M 96 89 C 92 93 88.5 98 88 104 C 87.5 108 89 112 92 114 C 94 110 97 103 99 98 C 97 96 96 92 96 89 Z M 105 92 C 108 96 110 100 111 104 C 112 108 111 112 108 114 C 106 112 104 108 103 104 C 103 100 104 95 105 92 Z"/>
</g>
<!-- Kilau bintang — pengetahuan, diperkecil jadi 1 titik premium, bukan 3 -->
<g fill="#6B8E73" opacity="0.9">
  <path d="M 116 44 L 117.5 47 L 121 48.5 L 117.5 50 L 116 53 L 114.5 50 L 111 48.5 L 114.5 47 Z"/>
</g>
</svg>
